name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: bloodlink-production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bloodlink-production/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run backend test suite
        run: npm test

      - name: Production build
        run: npm run build

      # P3b-9: block merges on high/critical advisories (moderate stays a
      # warning). Dependabot opens the fix PRs; this step guards the gate.
      - name: Dependency security audit
        run: npm audit --audit-level=high
